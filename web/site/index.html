<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>godCode</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Uncial+Antiqua&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><i class="ico i-white-tower" aria-hidden="true"></i>godCode</a>
  <button class="crumb" id="crumb" hidden></button>
  <div class="grow"></div>
  <div class="py" id="py" title="Python runtime"><i></i><span>Loading Python</span></div>
  <div class="stat" id="streak" title="Days in a row with at least one completion"></div>
  <div class="level" id="level"></div>
</header>

<main id="main"><div class="boot">Loading course…</div></main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head">
      <select id="drawer-module" aria-label="Module"></select>
      <button class="btn ghost" id="drawer-close" aria-label="Close outline">Close</button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
  </div>
</aside>

<dialog class="modal" id="sync-dialog">
  <form id="sync-form">
    <h2>Your account</h2>
    <div class="modes" role="tablist">
      <button type="button" role="tab" id="mode-in" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="mode-new" aria-selected="false">Create account</button>
    </div>
    <p id="sync-blurb"></p>
    <label>Username<input name="user" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" minlength="3" maxlength="32" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
    <details class="adv"><summary>Server</summary>
      <label>Server address<input name="url" type="text" inputmode="url" placeholder="https://sync.example.com" autocapitalize="off" spellcheck="false" required></label>
    </details>
    <p class="err" id="sync-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="sync-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="sync-go">Sign in</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="runner.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
